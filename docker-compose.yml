version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vsu-research-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    container_name: vsu-research-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  # Local-only email inbox for development. The app sends to port 1025;
  # read the messages at http://localhost:8025. Nothing reaches real inboxes.
  mailpit:
    image: axllent/mailpit:latest
    container_name: vsu-research-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  postgres_data:
